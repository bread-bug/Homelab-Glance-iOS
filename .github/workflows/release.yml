name: testflight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-26
    env:
      SCHEME: HomelabGlance
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PROFILE_NAME: ${{ vars.PROFILE_NAME }}
      PROFILE_NAME_EXT: ${{ vars.PROFILE_NAME_EXT }}
      EXT_BUNDLE_ID: ${{ vars.EXT_BUNDLE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Show commit
        run: git log --oneline -1

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.ASC_TEAM_ID }}
        run: xcodegen generate

      # A runner starts with an empty keychain, so the identity is imported each
      # run from one long-lived certificate. Nothing is created at Apple.
      - name: Import signing identity
        env:
          CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE }}
          PROVISION_PROFILE_EXT: ${{ secrets.BUILD_PROVISION_PROFILE_EXT }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # let codesign use the key without an interactive prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$PROVISION_PROFILE_EXT" | base64 --decode > "$RUNNER_TEMP/profile_ext.mobileprovision"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for p in profile profile_ext; do
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin \
              <<< "$(security cms -D -i "$RUNNER_TEMP/$p.mobileprovision")")
            cp "$RUNNER_TEMP/$p.mobileprovision" \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          done

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "codesigning identities imported: $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'valid identities found' || true)"
          security find-identity -v -p codesigning "$KEYCHAIN" | tail -1

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # fastlane wants the same credentials as json
          python3 - <<'PY' > "$RUNNER_TEMP/asc_key.json"
          import json, os
          print(json.dumps({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": open(os.path.expanduser(f"~/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")).read(),
              "in_house": False,
          }))
          PY

      - name: Next build number
        run: |
          set -euo pipefail
          # ask App Store Connect what was last uploaded so numbering stays
          # sequential instead of depending on CI run counters
          LATEST=$(fastlane run latest_testflight_build_number \
            app_identifier:"$BUNDLE_ID" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            initial_build_number:0 2>&1 | grep -oE 'Result: *[0-9]+' | grep -oE '[0-9]+' | tail -1)
          echo "BUILD_NUMBER=$(( LATEST + 1 ))" >> "$GITHUB_ENV"
          echo "latest uploaded: $LATEST"

      - name: Archive
        run: |
          set -o pipefail
          echo "building $BUILD_NUMBER"
          xcodebuild archive \
            -project HomelabGlance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/$SCHEME.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify

      - name: Confirm bundle version
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "build/$SCHEME.xcarchive/Products/Applications/$SCHEME.app/Info.plist"

      - name: Export IPA
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $PROFILE_NAME_EXT" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/$SCHEME.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "build/ipa/$SCHEME.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: build/ipa/

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
