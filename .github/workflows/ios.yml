name: build

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      SCHEME: HomelabGlance

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Device names change with every runner image; resolve one at runtime instead.
      - name: Pick a simulator
        if: github.event_name == 'workflow_dispatch'
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;ds=json.load(sys.stdin)['devices'];print(next(d['udid'] for rt in sorted(ds) for d in ds[rt] if d['name'].startswith('iPhone')))")
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *(.*) \(.*/\1/')
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "picked: $NAME ($UDID)"

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project HomelabGlance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Boot simulator and screenshot
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP=build/Build/Products/Debug-iphonesimulator/$SCHEME.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" --sample

          # give SwiftUI a moment to render before capturing
          sleep 3
          mkdir -p screenshots
          xcrun simctl io "$SIM_UDID" screenshot screenshots/light.png

          xcrun simctl ui "$SIM_UDID" appearance dark
          sleep 2
          xcrun simctl io "$SIM_UDID" screenshot screenshots/dark.png

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: screenshots
          path: screenshots/
