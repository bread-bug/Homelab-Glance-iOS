name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      SCHEME: HomelabGlance
      DEVICE: iPhone 16

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project HomelabGlance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE,arch=arm64" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
        continue-on-error: false

      - name: Boot simulator and screenshot
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -m1 "$DEVICE (" \
            | grep -oE '[0-9A-F-]{36}')
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP=build/Build/Products/Debug-iphonesimulator/$SCHEME.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          # give SwiftUI a moment to render before capturing
          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/light.png

          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/dark.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
